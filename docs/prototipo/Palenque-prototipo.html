<style>
:root{--bg:#f4efe4;--card:#fffdf8;--ink:#1c2620;--muted:#6c746a;--green:#1f4030;--green2:#2e5a43;--brass:#b08a3e;--line:#e4dccb;--red:#b4412f;--amber:#c08419;--ok:#3d7a52;--wa:#0b8f6a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#e9e2d2;color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:92px;box-shadow:0 0 40px rgba(0,0,0,.08)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;font-weight:700;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
.top{position:sticky;top:0;z-index:20;background:var(--green);color:#f4efe4;padding:12px 16px 12px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.logo b{font-family:Fraunces,serif;font-size:21px;letter-spacing:.01em}
.logo small{display:block;font-size:11px;opacity:.7;margin-top:-2px}
.pill{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#f4efe4;border-radius:99px;padding:5px 10px;font-size:12px;white-space:nowrap}
.pill.off{background:#c08419;border-color:#c08419}
select.pill{appearance:none;padding-right:22px;background-image:linear-gradient(45deg,transparent 50%,#f4efe4 50%),linear-gradient(135deg,#f4efe4 50%,transparent 50%);background-position:calc(100% - 12px) 50%,calc(100% - 8px) 50%;background-size:4px 4px;background-repeat:no-repeat}
select.pill option{color:#111}
.offbar{background:#c08419;color:#fff;font-size:12.5px;padding:7px 16px}
main{padding:16px}
.hello{margin:4px 0 14px}
.hello h1{font-size:26px}
.hello p{margin:2px 0 0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{font-size:17px;margin-bottom:8px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px}
.sec h3{font-size:18px}
.sec a{font-size:13px;color:var(--green2);font-weight:600;text-decoration:none;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;cursor:pointer}
.kpi b{display:block;font-family:Fraunces,serif;font-size:24px;line-height:1.1}
.kpi span{font-size:11px;color:var(--muted)}
.alert{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.alert:first-of-type{border-top:0;padding-top:2px}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.dot.red{background:var(--red)}.dot.amber{background:var(--amber)}.dot.ok{background:var(--ok)}
.alert b{display:block;font-weight:600}
.alert small{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid small{color:var(--muted);font-size:12.5px}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Fraunces,serif;font-weight:700;flex:none;object-fit:cover;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.st{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.st-juego{background:#dcebdf;color:#24543a}.st-lesion{background:#f6dcd6;color:#93301f}.st-doma{background:#efe4c9;color:#7a5a12}.st-cria{background:#f1dde8;color:#86375f}.st-desc{background:#e3e6ea;color:#46505a}.st-potr{background:#e2e9f3;color:#2f4f78}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--green);color:#f4efe4;border-color:var(--green)}
.wrapchips{flex-wrap:wrap;overflow:visible}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px}
.btn.pri{background:var(--green);border-color:var(--green);color:#f4efe4}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.block{width:100%;padding:14px;font-size:16px}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px 10px;z-index:30}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
.tabs button .i{font-size:20px;line-height:1.2}
.tabs button.on{color:var(--green);font-weight:700}
.tabs .plus .i{width:52px;height:52px;margin-top:-26px;border-radius:50%;background:var(--brass);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 6px 16px rgba(176,138,62,.45);border:4px solid var(--bg)}
.back{border:0;background:none;color:var(--green2);font-weight:600;padding:0;margin-bottom:10px}
.hero{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.hero h1{font-size:28px;line-height:1.05}
.hero small{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.grid2 div small{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.grid2 div span{font-weight:500}
.lnk{color:var(--green2);font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.acts button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 4px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.acts button span{font-size:20px}
.acts button.main{background:var(--green);color:#f4efe4;border-color:var(--green)}
.subtabs{display:flex;border-bottom:1px solid var(--line);margin:4px 0 12px;overflow-x:auto;scrollbar-width:none}
.subtabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.subtabs button.on{color:var(--green);border-color:var(--green)}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:15px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ti{position:relative;margin-bottom:12px}
.ti .ic{position:absolute;left:-22px;top:2px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--card);border:2px solid var(--line)}
.ti .bx{margin-left:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ti .bx b{font-weight:600}
.ti .meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}
.ti .bx p{margin:4px 0 0;font-size:14px}
.ti img{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-top:8px}
.pend{background:#fbecc9;color:#7a5512;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px;display:flex;gap:8px}
.banner.red{background:#f8e1db;color:#7e2a1b}.banner.amber{background:#f7ebcf;color:#6b4a0d}
.tree{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;align-items:center;font-size:12.5px}
.tree .n{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 8px;text-align:center}
.tree .n.me{background:var(--green);color:#f4efe4;border-color:var(--green);font-weight:700}
.tree .n.in{cursor:pointer;border-color:var(--green2);color:var(--green2);font-weight:600}
.tree .col{display:flex;flex-direction:column;gap:6px}
.tree small{display:block;opacity:.7;font-size:10.5px}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;margin:6px 0 4px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10.5px;color:var(--muted)}
.bars i{display:block;width:100%;border-radius:6px 6px 0 0;background:var(--green2)}
.bars i.var{background:var(--brass)}
.legend{font-size:12px;color:var(--muted);display:flex;gap:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tgrid button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 2px;font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
.tgrid button span{font-size:22px}
.tgrid button.on{border-color:var(--green);background:#e3eee6;box-shadow:inset 0 0 0 1px var(--green)}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.04em}
.in{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
textarea.in{min-height:80px;resize:vertical}
.hchips .chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 5px}
.hchips .chip .av{width:22px!important;height:22px!important;font-size:9px!important}
.step{display:flex;align-items:center;gap:8px;font-family:Fraunces,serif;font-size:17px;font-weight:700;margin:18px 0 8px}
.step i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--brass);color:#fff;font:700 13px Inter;display:flex;align-items:center;justify-content:center}
.sticky{position:sticky;bottom:86px;padding-top:10px;background:linear-gradient(transparent,var(--bg) 30%)}
.ag{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.ag .mid{flex:1;min-width:0}
.ag .mid b{display:block;font-weight:600}
.ag .mid small{color:var(--muted)}
.due{font-size:12px;font-weight:700;white-space:nowrap}
.due.red{color:var(--red)}.due.amber{color:var(--amber)}.due.ok{color:var(--ok)}
.menu .row .i{font-size:22px;width:36px;text-align:center}
.ask{display:flex;gap:8px}
.ask input{flex:1}
.ans{background:#eef3ee;border-radius:12px;padding:12px;margin-top:10px;font-size:14.5px;white-space:pre-wrap}
.ans:empty{display:none}
.wa-top{background:#075e54;color:#fff;padding:12px 14px;border-radius:16px 16px 0 0;display:flex;gap:10px;align-items:center}
.wa-top b{display:block}
.wa-top small{opacity:.8;font-size:12px}
.wa-body{background:#efe7dc;padding:12px;min-height:340px;max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.msg{max-width:84%;padding:8px 10px;border-radius:10px;font-size:14px;box-shadow:0 1px 0 rgba(0,0,0,.08);white-space:pre-wrap}
.msg.me{align-self:flex-end;background:#d9fdd3}
.msg.bot{align-self:flex-start;background:#fff}
.msg small{display:block;text-align:right;font-size:10.5px;color:#7a8a80;margin-top:2px}
.wa-in{display:flex;gap:6px;padding:8px;background:#f0f0f0;border-radius:0 0 16px 16px}
.wa-in input{flex:1;border:0;border-radius:99px;padding:10px 14px;background:#fff}
.wa-in button{border:0;width:42px;height:42px;border-radius:50%;background:var(--wa);color:#fff;font-size:18px}
.bk{position:fixed;inset:0;background:rgba(20,28,22,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px 16px 28px;max-height:88vh;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet .x{float:right;border:0;background:var(--card);border-radius:50%;width:32px;height:32px;font-size:16px}
#splash{position:fixed;inset:0;z-index:100;background:#1f4030;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .45s ease;cursor:pointer}
#splash img{width:min(56vw,240px);height:auto;display:block}
#splash b{font-family:Fraunces,Georgia,serif;font-size:34px;color:#f4efe4;letter-spacing:.02em}
#splash small{color:#c9d2c6;font-size:13px;margin-top:-10px}
#splash.hide{opacity:0;pointer-events:none}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.sale{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.sale h2{font-size:24px}
.sale .tag{display:inline-block;background:#e3eee6;color:var(--green);font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.sale ul{padding-left:18px;margin:8px 0}
.qrbox{display:flex;justify-content:center;padding:16px;background:#fff;border-radius:16px;border:1px solid var(--line)}
.tag-demo{font-size:11px;background:#efe4c9;color:#7a5a12;padding:2px 7px;border-radius:99px;font-weight:600;vertical-align:2px}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.mrow{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.mrow:first-child{border-top:0}
.load{height:8px;border-radius:99px;background:#e8e1d0;overflow:hidden;margin-top:5px}
.load i{display:block;height:100%;border-radius:99px}
</style>
</head>

/* ---------- estado ---------- */
const KEY='palenque-demo-v1';
let S;
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===1)return o}}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S=load();
const H=()=>S.horses;
const hb=id=>S.horses.find(h=>h.id===id);
const evsOf=id=>S.events.filter(e=>e.horseId===id).sort((a,b)=>b.date.localeCompare(a.date)||(+b.id.slice(1))-(+a.id.slice(1)));
const canCost=()=>['dueno','encargado'].includes(S.role);
function newEvent(horseId,tipo,titulo,o={}){const e=Object.assign({id:'e'+(S.n++),horseId,date:iso(now),tipo,titulo,nota:'',por:ROLES[S.role].n,costo:0},o);if(S.offline)e.pend=true;S.events.push(e);return e}
const activeH=()=>H().filter(h=>!['Vendido','Retirado'].includes(h.estado));

/* ---------- lógica ---------- */
function chukkersOf(id,days){return S.events.filter(e=>e.horseId===id&&e.tipo==='partido'&&age(e)<=days).reduce((a,e)=>a+(e.chukkers||0),0)}
const RULES=[
 {k:'herr',tipo:'herreria',m:/herr|herradura|despalme/,every:42,label:'Herrado',tit:'Herrado completo',skip:h=>['Cría','Potrillo','Descanso'].includes(h.estado)},
 {k:'vac',tipo:'sanidad',m:/vacuna influenza/,every:180,label:'Vacuna influenza y tétanos',tit:'Vacuna influenza y tétanos'},
 {k:'desp',tipo:'sanidad',m:/desparasit/,every:90,label:'Desparasitación',tit:'Desparasitación'},
 {k:'aie',tipo:'sanidad',m:/aie/,every:60,label:'Análisis AIE',tit:'Análisis AIE',skip:h=>h.estado==='Potrillo'},
 {k:'dent',tipo:'dientes',m:/dient|odont/,every:365,label:'Control de dientes',tit:'Limado de dientes',need:true}
];
function agenda(){
 const out=[];
 activeH().forEach(h=>{const es=evsOf(h.id);RULES.forEach(r=>{
  if(r.skip&&r.skip(h))return;
  const last=es.find(e=>e.tipo===r.tipo&&r.m.test(norm(e.titulo)));
  if(!last){if(r.need)return;out.push({h,r,label:r.label,diff:0,none:true});return}
  const due=new Date(toD(last.date).getTime()+r.every*DAY);
  out.push({h,r,label:r.label,diff:diffDays(now,due),last:last.date});
 })});
 return out.sort((a,b)=>a.diff-b.diff);
}
function alertsFor(h){
 const out=[],es=evsOf(h.id);
 const nc=es.filter(e=>isNoComio(e)&&age(e)<=7).length;
 if(nc>=2)out.push({lvl:'red',h,t:h.name+' no comió bien '+nc+' veces en 7 días',s:'Patrón detectado · conviene que la vea la veterinaria'});
 const les=es.filter(e=>e.tipo==='lesion'&&age(e)<=3);
 if(les.length&&h.estado!=='Lesionado')out.push({lvl:'red',h,t:h.name+': '+les[0].titulo.toLowerCase(),s:'Cargado '+rel(les[0].date)+(les[0].por?' por '+les[0].por:'')+' · no debería jugar hasta revisarla'});
 if(h.estado==='Lesionado'){const lv=es.find(e=>e.tipo==='vet');out.push({lvl:'amber',h,t:h.name+' en recuperación',s:lv?'Último control veterinario '+rel(lv.date)+' · '+lv.titulo.toLowerCase():'Sin control veterinario cargado'})}
 const ch=chukkersOf(h.id,14);if(ch>=4)out.push({lvl:'amber',h,t:h.name+' jugó '+ch+' chukkers en 14 días',s:'Carga alta · se sugiere descanso en el próximo partido'});
 return out;
}
function alerts(){
 let out=[];activeH().forEach(h=>out=out.concat(alertsFor(h)));
 out.sort((a,b)=>(a.lvl==='red'?0:1)-(b.lvl==='red'?0:1));
 const ov=agenda().filter(a=>a.diff<0);
 if(ov.length)out.push({lvl:'amber',t:ov.length+' vencimientos atrasados',s:ov.slice(0,3).map(a=>a.label+' · '+a.h.name).join(' · ')+(ov.length>3?'…':''),go:'agenda'});
 return out;
}
function costOf(id,from,to){return S.events.filter(e=>(!id||e.horseId===id)&&e.date>=from&&e.date<=to).reduce((a,e)=>a+(e.costo||0),0)}
function months(n){const r=[];for(let i=n-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const e=new Date(d.getFullYear(),d.getMonth()+1,0);r.push({l:MES[d.getMonth()],from:iso(d),to:iso(e)})}return r}

function avatar(h,s=44){

 return `<div class="av" style="width:${s}px;height:${s}px;background:${pelColor(h.pelaje)};font-size:${Math.round(s*.4)}px">${esc(ini)}</div>`;
}

let V={v:'home',p:null,stack:[]};
function go(v,p,noPush){
 if(!noPush&&!(V.v===v&&V.p===p))V.stack.push({v:V.v,p:V.p});
 V.v=v;V.p=p??null;render();window.scrollTo(0,0);
}
function back(){const b=V.stack.pop();if(b){V.v=b.v;V.p=b.p;render();window.scrollTo(0,0)}else go('home',null,true)}

}

function tFam(h){
 const P=par(h,'padre'),M=par(h,'madre');
 const pp=par(P.obj,'padre'),pm=par(P.obj,'madre'),mp=par(M.obj,'padre'),mm=par(M.obj,'madre');

 <div class="tl">${es.map(e=>evItem(e)).join('')||'<div class="empty">No jugó partidos registrados.</div>'}</div>`;

function tCost(h){
 const M=months(6);const data=M.map(m=>({l:m.l,v:costOf(h.id,m.from,m.to),f:FIJO}));
 const mx=Math.max(...data.map(d=>d.v+d.f));
 const by={};evsOf(h.id).filter(e=>age(e)<=180&&e.costo).forEach(e=>by[e.tipo]=(by[e.tipo]||0)+e.costo);
 const tot=data.reduce((a,d)=>a+d.v+d.f,0);
 return `<div class="card"><h3>Costo por mes</h3>

function summary(h){
 const es=evsOf(h.id).filter(e=>age(e)<=180);const by=t=>es.filter(e=>e.tipo===t);
 const p=[];
 p.push(`${h.name} (${h.sexo.toLowerCase()}, ${edad(h)}) está hoy ${h.estado.toLowerCase()}${h.ubic?', en '+h.ubic:''}.`);
 const cnt={};es.forEach(e=>cnt[e.tipo]=(cnt[e.tipo]||0)+1);
 p.push(`En los últimos 6 meses tiene ${es.length} registros: `+Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,4).map(t=>cnt[t]+' de '+TIPOS[t].l.toLowerCase()).join(', ')+'.');
 const v=by('vet');if(v.length)p.push(`Última visita veterinaria ${rel(v[0].date)}: ${v[0].titulo.toLowerCase()}.${v[0].nota?' '+v[0].nota:''}`);
 const l=by('lesion');p.push(l.length?`Tiene ${l.length} registro${l.length>1?'s':''} de lesión; el último ${rel(l[0].date)} (${l[0].titulo.toLowerCase()}).`:'No tuvo lesiones en este período.');
 const nc=es.filter(isNoComio);if(nc.length)p.push(`Hay ${nc.length} registro${nc.length>1?'s':''} de que no comió bien, ${nc.filter(e=>age(e)<=7).length} en la última semana.`);
 const c=chukkersOf(h.id,180);if(c)p.push(`Jugó ${c} chukkers, ${chukkersOf(h.id,14)} en las últimas dos semanas.`);
 const ag=agenda().filter(a=>a.h.id===h.id).slice(0,2);
 if(ag.length)p.push('Próximo: '+ag.map(a=>a.label.toLowerCase()+' '+(a.diff<0?'vencido hace '+(-a.diff)+' días':a.diff===0?'hoy':'en '+a.diff+' días')).join('; ')+'.');
 const al=alertsFor(h);
 p.push(al.length?'Recomendación: '+(al.some(a=>/no comi|caliente|renguera|corte|golpe|tendon|inflam/.test(norm(a.t)))?'que la revise la veterinaria antes de volver a jugar.':al[0].s.split('·').pop().trim()+'.'):'Recomendación: sin señales de alerta, puede seguir con su rutina.');
 if(canCost()){const g=es.reduce((a,e)=>a+(e.costo||0),0);if(g)p.push(`Gasto variable del período: ${money(g)}.`)}
 return p.join('\n\n');
}

function parseMsg(txt){
 const t=norm(txt),found=[];
 H().forEach(h=>{const n=norm(h.name);if(new RegExp('(^|[^a-z])'+n.replace(/\s+/g,'\\s+')+'([^a-z]|$)').test(t))found.push(h)});
 const re=/(?:caballo|el|la|nro\.?|numero|n°|#)\s*(\d{1,3})(?!\d)/g;let m;
 while((m=re.exec(t))){const h=H().find(x=>x.nro===+m[1]);if(h&&!found.includes(h))found.push(h)}
 const R=[[/no (quiso )?com[ie]|comio poco|no toco/,'alimento','No quiso comer'],[/caliente/,'lesion','Mano caliente'],[/rengu|manque|renga|rengo/,'lesion','Renguera'],[/hinchad|inflamad/,'lesion','Inflamación'],[/corte|se corto|herida/,'lesion','Corte'],[/herr/,'herreria','Herrado completo'],[/vacun/,'sanidad','Vacuna influenza y tétanos'],[/desparasit/,'sanidad','Desparasitación'],[/\baie\b|anemia/,'sanidad','Análisis AIE'],[/veterin|\bvet\b|ecograf|radiograf/,'vet','Revisión veterinaria'],[/dient|limad/,'dientes','Limado de dientes'],[/vare|taque|practic|galop|trabaj/,'trabajo','Trabajo'],[/decaid|triste|apagad/,'conducta','Decaído'],[/nervios|inquiet/,'conducta','Nervioso'],[/traslad|viaj|se fue a/,'traslado','Traslado']];
 let evs=[];R.forEach(([r,tipo,tit])=>{if(r.test(t)&&!evs.some(e=>e.tipo===tipo&&e.t===tit))evs.push({tipo,t:tit})});
 if(!evs.length)evs=[{tipo:'nota',t:'Observación'}];
 return {found,evs};
}

 found.forEach(h=>evs.forEach(e=>{newEvent(h.id,e.tipo,e.t,{nota:'Por WhatsApp: "'+txt+'"',por:'Juan (petisero) · WhatsApp'});if(e.tipo==='lesion')h.estado='Lesionado'}));
 S.role=prev;
 let r='✅ Listo. Cargué en '+found.map(h=>h.name+' #'+h.nro).join(' y ')+':\n'+evs.map(e=>TIPOS[e.tipo].i+' '+e.t).join('\n');

function answer(q){
 const t=norm(q);
 const h=H().find(x=>t.includes(norm(x.name)));
 if(h&&!/gast|cost/.test(t))return summary(h);
 if(/no com|comer|comio|comida|aliment/.test(t)){const L=H().map(h=>({h,n:evsOf(h.id).filter(e=>isNoComio(e)&&age(e)<=7).length})).filter(x=>x.n);return L.length?'Esta semana no comieron bien:\n'+L.map(x=>'• '+x.h.name+': '+x.n+' vez'+(x.n>1?'es':'')).join('\n')+'\n\nSugerencia: si se repite, que la vea la veterinaria.':'Esta semana todos comieron bien.'}
 if(/lesion|lesionad|tendon|rengu|lastim/.test(t)){const L=S.events.filter(e=>e.tipo==='lesion'&&age(e)<=365).sort((a,b)=>b.date.localeCompare(a.date));return L.length?'Lesiones del último año:\n'+L.map(e=>'• '+hb(e.horseId).name+': '+e.titulo.toLowerCase()+' ('+rel(e.date)+')').join('\n'):'No hay lesiones registradas en el último año.'}
 if(/venc|pendient|agenda|toca|herr|vacun/.test(t)){const A=agenda(),ov=A.filter(a=>a.diff<0),nx=A.filter(a=>a.diff>=0&&a.diff<=14);return (ov.length?'Vencidos:\n'+ov.map(a=>'• '+a.label+' · '+a.h.name+' (hace '+(-a.diff)+' días)').join('\n'):'No hay nada vencido.')+(nx.length?'\n\nEn los próximos 14 días:\n'+nx.slice(0,6).map(a=>'• '+a.label+' · '+a.h.name+' ('+(a.diff===0?'hoy':'en '+a.diff+' días')+')').join('\n'):'')}
 if(/jug|chukker|partido|cansad|descans|rotac|carga/.test(t)){const L=H().map(h=>({h,c:chukkersOf(h.id,14)})).filter(x=>x.c).sort((a,b)=>b.c-a.c);return 'Chukkers en los últimos 14 días:\n'+L.map(x=>'• '+x.h.name+': '+x.c+(x.c>=4?'  ← conviene que descanse':'')).join('\n')}
 if(/gast|cost|plata|presupuest/.test(t)){if(!canCost())return 'Los costos solo los ven el dueño y el encargado.';const m=months(1)[0];const L=H().map(h=>({h,v:costOf(h.id,m.from,m.to)})).filter(x=>x.v).sort((a,b)=>b.v-a.v);const tot=L.reduce((a,x)=>a+x.v,0);return 'Gastos variables de este mes: '+money(tot)+'\n'+L.slice(0,5).map(x=>'• '+x.h.name+': '+money(x.v)).join('\n')+'\n\nMás pensión y alimento: '+money(FIJO*activeH().length)+' ('+activeH().length+' caballos).'}
 if(/pre(n|ñ)|cria|potr|servic|embri/.test(t)){const L=S.events.filter(e=>e.tipo==='cria'&&age(e)<=120).sort((a,b)=>b.date.localeCompare(a.date));return L.length?'Reproducción reciente:\n'+L.map(e=>'• '+hb(e.horseId).name+': '+e.titulo.toLowerCase()+' ('+rel(e.date)+')'+(e.nota?' — '+e.nota:'')).join('\n'):'No hay movimientos de cría recientes.'}
 return 'Puedo responder sobre alimentación, lesiones, vencimientos, partidos, costos, cría o cualquier caballo por su nombre. Probá: "¿cómo está Picardía?"';
}

/* ---------- PARTIDOS ---------- */
function vMatches(){
 const P=[...S.partidos].sort((a,b)=>b.date.localeCompare(a.date));
 const J=activeH().filter(h=>['En juego','Lesionado','Descanso'].includes(h.estado));
 const mx=Math.max(4,...J.map(h=>chukkersOf(h.id,14)));
 return `<button class="back" onclick="back()">← Volver</button><h1 style="font-size:26px;margin:0 0 4px">Partidos y rotación</h1>
 <div class="card"><h3>¿Quién está para el próximo partido?</h3>${J.sort((a,b)=>chukkersOf(b.id,14)-chukkersOf(a.id,14)).map(h=>{const c=chukkersOf(h.id,14),red=alertsFor(h).some(a=>a.lvl==='red')||h.estado==='Lesionado';const st=red?['No disponible','var(--red)']:h.estado==='Descanso'?['En descanso','var(--muted)']:c>=4?['Mejor que descanse','var(--amber)']:['Disponible','var(--ok)'];
  return `<div style="padding:8px 0;border-top:1px solid var(--line);cursor:pointer" onclick="go('horse','${h.id}')"><div style="display:flex;justify-content:space-between"><b>${esc(h.name)}</b><span style="color:${st[1]};font-weight:600;font-size:13px">${st[0]}</span></div><div class="load"><i style="width:${c/mx*100}%;background:${st[1]}"></i></div><small class="muted">${c} chukkers en 14 días</small></div>`}).join('')}</div>
 <div class="sec"><h3>Partidos</h3><a onclick="newMatch()">+ Cargar partido</a></div>
 ${P.map(p=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><div><b>${esc(p.torneo)}</b><div class="muted" style="font-size:13px">vs ${esc(p.rival)} · ${fmtD(p.date)}</div></div><b style="white-space:nowrap;color:${/ganad/i.test(p.resultado)?'var(--ok)':/perdid/i.test(p.resultado)?'var(--red)':'var(--muted)'}">${esc(p.resultado)}</b></div>
 <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:10px">${p.ch.map((id,i)=>{const h=hb(id);return `<div style="text-align:center;font-size:11px"><div class="muted">${i+1}º</div>${h?`<div onclick="go('horse','${h.id}')" style="cursor:pointer;display:flex;justify-content:center">${avatar(h,30)}</div><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(h.name)}</div>`:'—'}</div>`}).join('')}</div></div>`).join('')}`;
}
function newMatch(){
 const J=activeH().filter(h=>['En juego','Descanso'].includes(h.estado));
 const opts=`<option value="">—</option>`+J.map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join('');
 sheet(`<h2 style="font-size:22px">Cargar partido</h2>
 <label class="f">Torneo</label><input id="mT" class="in" value="Copa Primavera · Final">
 <div class="grid2" style="gap:0 10px"><div><label class="f">Rival</label><input id="mR" class="in" placeholder="Equipo"></div><div><label class="f">Resultado</label><input id="mRes" class="in" placeholder="Ganado 10 a 8"></div></div>
 <label class="f">Caballo por chukker</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${[1,2,3,4,5,6].map(i=>`<label style="font-size:13px">${i}º chukker<select id="mc${i}" class="in" style="padding:8px">${opts}</select></label>`).join('')}</div>
 <button class="btn pri block" style="margin-top:14px" onclick="saveMatch()">Guardar partido</button>`);
}
function saveMatch(){
 const p={id:'p'+Date.now(),date:iso(now),torneo:$('#mT').value||'Partido',rival:$('#mR').value||'Rival',resultado:$('#mRes').value||'—',ch:[1,2,3,4,5,6].map(i=>$('#mc'+i).value||null)};
 if(!p.ch.some(Boolean)){toast('Elegí al menos un caballo');return}
 S.partidos.push(p);addMatchEvents(p,(h,date,tipo,titulo,o)=>newEvent(h,tipo,titulo,Object.assign({date},o)));
 save();closeSheet();toast('Partido guardado en cada ficha');render();
}

/* ---------- CRÍA ---------- */
function vCria(){
 const pad=H().filter(h=>h.sexo==='Padrillo'),yeg=H().filter(h=>h.estado==='Cría'&&h.sexo==='Yegua');
 const cr=H().filter(h=>(h.padreId||h.madreId)&&diffDays(toD(h.nac),now)<365*5).sort((a,b)=>b.nac.localeCompare(a.nac));
 const lastC=h=>evsOf(h.id).find(e=>e.tipo==='cria');
 return `<button class="back" onclick="back()">← Volver</button><h1 style="font-size:26px;margin:0 0 4px">Cría</h1>
 <div class="sec"><h3>Padrillos</h3></div>${pad.map(h=>horseRow(h,`<small style="display:block">${H().filter(x=>x.padreId===h.id).length} hijos en la base</small>`)).join('')}
 <div class="sec"><h3>Yeguas madres</h3></div>${yeg.map(h=>{const l=lastC(h);return horseRow(h,`<small style="display:block">${l?esc(l.titulo)+' · '+rel(l.date):'Sin movimientos de cría'}</small>`)}).join('')}
 <div class="sec"><h3>Crías jóvenes</h3></div>${cr.map(h=>horseRow(h,`<small style="display:block">${esc(par(h,'padre').name)} × ${esc(par(h,'madre').name)}</small>`)).join('')}`;
}

/* ---------- COSTOS ---------- */
function vCosts(){
 if(!canCost())return '<button class="back" onclick="back()">← Volver</button><div class="empty">Esta sección la ven solo el dueño y el encargado.</div>';
 const M=months(6),A=activeH().length;const data=M.map(m=>({l:m.l,v:costOf(null,m.from,m.to),f:FIJO*A}));const mx=Math.max(...data.map(d=>d.v+d.f));
 const from=dAgo(180),to=iso(now);
 const per=activeH().map(h=>({h,v:costOf(h.id,from,to)+FIJO*6})).sort((a,b)=>b.v-a.v);
 return `<button class="back" onclick="back()">← Volver</button><h1 style="font-size:26px;margin:0 0 4px">Costos</h1>
 <div class="card"><h3>Caballeriza por mes</h3><div class="bars">${data.map(d=>`<div><span style="font-size:10px">${(Math.round((d.v+d.f)/1e5)/10).toLocaleString('es-AR')}M</span><i class="var" style="height:${d.v/mx*100}%"></i><i style="height:${d.f/mx*100}%;border-radius:0"></i>${d.l}</div>`).join('')}</div>
 <div class="legend"><span><i style="background:var(--green2)"></i>Pensión y alimento</span><span><i style="background:var(--brass)"></i>Variables</span></div></div>
 <div class="card"><h3>Costo por caballo · 6 meses</h3>${per.map(x=>`<div class="mrow" style="cursor:pointer" onclick="V.tab='cost';V.tabFor='${x.h.id}';go('horse','${x.h.id}')"><span>${esc(x.h.name)}</span><b>${money(x.v)}</b></div>`).join('')}</div>
 <p class="muted" style="font-size:12px">Valores de ejemplo.</p>`;
}

/* ---------- roles y red ---------- */
function setRole(r){S.role=r;save();toast('Viendo como '+ROLES[r].l.toLowerCase());if(V.v==='costs'&&!canCost())go('home');else render()}
function toggleNet(){
 S.offline=!S.offline;
 if(!S.offline){const p=S.events.filter(e=>e.pend);p.forEach(e=>delete e.pend);save();render();toast(p.length?'Volvió la señal · se sincronizaron '+p.length+' movimiento'+(p.length>1?'s':''):'Volvió la señal');}
 else{save();render();toast('Modo sin señal: probá cargar algo')}
}
render();
function hideSplash(){const s=document.getElementById("splash");if(!s||s.classList.contains("hide"))return;s.classList.add("hide");setTimeout(()=>s.remove(),500)}
setTimeout(hideSplash,1600);
